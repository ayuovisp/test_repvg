trigger:
  - main # Automatically runs the pipeline whenever code is pushed to the main branch

pool:
  vmImage: 'ubuntu-latest' # The Microsoft-hosted virtual machine that runs the tasks

stages:
- stage: Build
  displayName: 'Continuous Integration - Build'
  jobs:
  - job: BuildJob
    steps:
    # 1. Restore and Build the project
    - task: DotNetCoreCLI@2
      displayName: 'Restore & Build Application'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration Release'

    # 2. Publish the build output to a staging folder
    - task: DotNetCoreCLI@2
      displayName: 'Publish Application Packages'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    # 3. Upload the artifact to Azure DevOps storage
    - task: PublishBuildArtifacts@1
      displayName: 'Upload Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
- stage: DeployToDev
  displayName: 'Continuous Delivery - Deploy to Dev'
  dependsOn: Build # Ensures this stage only runs if the Build stage passes
  condition: succeeded()
  jobs:
  - deployment: DeployJob
    environment: 'Development' # Creates an environment log within Azure DevOps
    strategy:
      runOnce:
        deploy:
          steps:
          # 1. Deploy the zip package to an Azure App Service
          - task: AzureRmWebAppDeployment@4
            displayName: 'Deploy to Azure App Service'
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: 'MyAzureSC' # Must match the Service Connection name from Step 4
              appType: 'webAppLinux'
              WebAppName: 'my-dev-web-app' # The actual name of your App Service in the Azure Portal
              Package: '$(Pipeline.Workspace)/drop/**/*.zip'
